<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>YTL Broadband · Signatures</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172b40; background: #eff4f7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
    header { max-width: 640px; margin: auto; padding: 28px 4px 20px; }
    .brand { margin: 0 0 10px; color: #147c86; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.04em; }
    p { line-height: 1.55; }
    header p:last-child { margin: 0; color: #526679; }
    main { max-width: 640px; margin: auto; display: grid; gap: 18px; }
    section { background: white; border: 1px solid #d7e2e8; border-radius: 18px; padding: 20px; }
    h2 { margin: 0 0 16px; font-size: 19px; }
    label { display: block; font-size: 14px; font-weight: 650; margin: 0 0 8px; }
    input { width: 100%; padding: 13px; border: 1px solid #bdcdd8; border-radius: 9px; font: inherit; font-size: 16px; color: inherit; }
    input:focus { outline: 3px solid #c7e8e8; border-color: #147c86; }
    .pad { margin-top: 16px; border: 1px dashed #8ca7b8; border-radius: 12px; overflow: hidden; position: relative; background: #fcfdfd; }
    canvas { width: 100%; height: 200px; display: block; touch-action: none; cursor: crosshair; }
    .hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: #7a8f9e; font-size: 14px; }
    .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; }
    .state { font-size: 13px; color: #667c8c; }
    button { font: inherit; font-weight: 650; border: 0; cursor: pointer; border-radius: 9px; padding: 11px 15px; min-height: 44px; }
    button:focus-visible { outline: 3px solid #7fc7ce; outline-offset: 3px; }
    .secondary { color: #295369; background: #eaf1f5; }
    .primary { width: 100%; color: white; background: #116f79; padding: 16px; }
    #status { margin: 12px 4px 0; font-size: 14px; color: #526679; }
    #status.error { color: #a52d36; }
    @media (max-width: 380px) { section { padding: 15px; } canvas { height: 180px; } }
    @media (prefers-reduced-motion: no-preference) { button { transition: background .15s; } button:hover { filter: brightness(.95); } }
  </style>
</head>
<body>
  <header>
    <p class="brand">YTL BROADBAND</p>
    <h1>Draw signatures</h1>
    <p>The engineer and customer can sign on this phone. Use a finger or stylus inside each box.</p>
  </header>
  <main>
    <section aria-labelledby="engineer-title">
      <h2 id="engineer-title">Engineer</h2>
      <div class="pad">
        <canvas id="engineer-pad" aria-label="Draw engineer signature" role="img"></canvas>
        <span class="hint">Draw engineer signature here</span>
      </div>
      <div class="tools"><span class="state" id="engineer-state">Awaiting signature</span>
        <div><button class="secondary" type="button" data-undo="engineer">Undo</button>
          <button class="secondary" type="button" data-clear="engineer">Clear</button></div>
      </div>
    </section>
    <section aria-labelledby="customer-title">
      <h2 id="customer-title">Customer</h2>
      <div class="pad">
        <canvas id="customer-pad" aria-label="Draw customer signature" role="img"></canvas>
        <span class="hint">Draw customer signature here</span>
      </div>
      <div class="tools"><span class="state" id="customer-state">Awaiting signature</span>
        <div><button class="secondary" type="button" data-undo="customer">Undo</button>
          <button class="secondary" type="button" data-clear="customer">Clear</button></div>
      </div>
    </section>
    <div>
      <button id="submit-signatures" class="primary" type="button">Submit signatures</button>
      <p id="status" role="status" aria-live="polite">Draw both signatures, then submit them to the bot.</p>
    </div>
  </main>
  <script>
    'use strict';
    const pads = new Map();
    const status = document.getElementById('status');
    const submit = document.getElementById('submit-signatures');
    const telegram = window.Telegram?.WebApp;
    const request = new URLSearchParams(window.location.search).get('request');
    telegram?.ready();

    function drawStrokes(context, strokes, width, height) {
      context.strokeStyle = '#172b40';
      context.fillStyle = '#172b40';
      context.lineWidth = 2.5;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      for (const stroke of strokes) {
        if (!stroke.length) continue;
        context.beginPath();
        context.moveTo(stroke[0].x * width, stroke[0].y * height);
        for (const point of stroke.slice(1)) context.lineTo(point.x * width, point.y * height);
        context.stroke();
        if (stroke.length === 1) {
          context.beginPath();
          context.arc(stroke[0].x * width, stroke[0].y * height, 1.25, 0, Math.PI * 2);
          context.fill();
        }
      }
    }

    for (const role of ['engineer', 'customer']) {
      const canvas = document.getElementById(`${role}-pad`);
      const context = canvas.getContext('2d');
      const pad = { canvas, strokes: [], pointer: null };
      pads.set(role, pad);

      function redraw() {
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = Math.round(bounds.width * ratio);
        canvas.height = Math.round(bounds.height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        drawStrokes(context, pad.strokes, bounds.width, bounds.height);
        canvas.nextElementSibling.hidden = pad.strokes.length > 0;
        canvas.nextElementSibling.style.display = pad.strokes.length ? 'none' : 'grid';
        document.getElementById(`${role}-state`).textContent = pad.strokes.length ? 'Signature ready' : 'Awaiting signature';
      }
      pad.redraw = redraw;

      function point(event) {
        const bounds = canvas.getBoundingClientRect();
        return { x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
                 y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height)) };
      }

      canvas.addEventListener('pointerdown', event => {
        if (pad.pointer !== null || !event.isPrimary || event.button !== 0) return;
        event.preventDefault();
        pad.pointer = event.pointerId;
        canvas.setPointerCapture(event.pointerId);
        pad.strokes.push([point(event)]);
        redraw();
      });
      canvas.addEventListener('pointermove', event => {
        if (event.pointerId !== pad.pointer) return;
        event.preventDefault();
        pad.strokes[pad.strokes.length - 1].push(point(event));
        redraw();
      });
      function finish(event) {
        if (event.pointerId !== pad.pointer) return;
        pad.pointer = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      }
      canvas.addEventListener('pointerup', finish);
      canvas.addEventListener('pointercancel', finish);
      canvas.addEventListener('lostpointercapture', finish);
      new ResizeObserver(redraw).observe(canvas);
    }

    document.querySelectorAll('[data-clear]').forEach(button => button.addEventListener('click', () => {
      const pad = pads.get(button.dataset.clear);
      pad.pointer = null;
      pad.strokes = [];
      pad.redraw();
    }));
    document.querySelectorAll('[data-undo]').forEach(button => button.addEventListener('click', () => {
      const pad = pads.get(button.dataset.undo);
      if (pad.pointer !== null) return;
      pad.strokes.pop();
      pad.redraw();
    }));

    function encodeSignature(pad, step) {
      const bytes = [];
      for (const stroke of pad.strokes) {
        if (bytes.length) bytes.push(255);
        for (let index = 0; index < stroke.length; index += step) {
          const point = stroke[index];
          bytes.push(Math.round(point.x * 254), Math.round(point.y * 254));
        }
        if ((stroke.length - 1) % step) {
          const last = stroke[stroke.length - 1];
          bytes.push(Math.round(last.x * 254), Math.round(last.y * 254));
        }
      }
      const bounds = pad.canvas.getBoundingClientRect();
      return [Number((bounds.width / bounds.height).toFixed(3)), btoa(bytes.map(byte => String.fromCharCode(byte)).join(''))];
    }

    submit.addEventListener('click', () => {
      status.classList.remove('error');
      try {
        if (!telegram?.sendData || !/^[a-f0-9]{8}$/.test(request || '')) {
          throw new Error('Open the signing page from the keyboard in the Telegram bot.');
        }
        for (const [role, pad] of pads) {
          const distinct = new Set(pad.strokes.flat().map(point => `${Math.round(point.x * 254)},${Math.round(point.y * 254)}`));
          if (distinct.size < 2 || pad.pointer !== null) throw new Error(`Finish drawing the ${role} signature.`);
        }
        let payload;
        for (let step = 1; step <= 128; step *= 2) {
          payload = JSON.stringify({request, engineer: encodeSignature(pads.get('engineer'), step),
                                             customer: encodeSignature(pads.get('customer'), step)});
          if (new TextEncoder().encode(payload).length <= 4096) break;
        }
        if (new TextEncoder().encode(payload).length > 4096) {
          throw new Error('The drawings are too large. Please clear them and sign again.');
        }
        status.textContent = 'Submitting signatures to the bot…';
        submit.disabled = true;
        telegram.sendData(payload);
      } catch (error) {
        submit.disabled = false;
        status.textContent = error.message || 'Could not submit. Please try again.';
        status.classList.add('error');
      }
    });
  </script>
</body>
</html>
